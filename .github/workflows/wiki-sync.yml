name: Sync Wiki

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - ".github/workflows/wiki-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish wiki pages
        env:
          WIKI_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git
        run: |
          set -e
          if ! git clone "$WIKI_URL" wiki-repo 2>/dev/null; then
            echo "::error::Wiki git repo not found. Create the first page in the browser:"
            echo "https://github.com/${{ github.repository }}/wiki → Create the first page → Save"
            echo "Then re-run this workflow. See docs/WIKI.md"
            exit 1
          fi
          echo "Cloned existing wiki."
          cp wiki/*.md wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git commit -m "Sync wiki from ${{ github.sha }}"
          # GitHub Wiki uses branch "master", not "main"
          WIKI_BRANCH=$(git branch --show-current)
          echo "Pushing to wiki branch: ${WIKI_BRANCH}"
          git push origin "HEAD:${WIKI_BRANCH}"
