# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Root: plugin build tooling (playwright for screenshots)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: chore(deps)
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        patterns:
          - "*"

  # Spring Boot starter
  - package-ecosystem: maven
    directory: /spring-boot-starter
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - java
    commit-message:
      prefix: chore(deps)
      include: scope
    groups:
      spring-boot:
        patterns:
          - org.springframework.boot*
          - org.springframework*
      springdoc:
        patterns:
          - org.springdoc*

  # GitHub Actions (ci, release, pages)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore(deps)
      include: scope
