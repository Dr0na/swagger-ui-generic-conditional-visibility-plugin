openapi: 3.1.0
info:
  title: Generic conditional visibility sample API
  version: 1.0.0
  description: |
    Demonstrates `x-conditional` with three selectors (path + query + header)
    and request-body resolution via maps.

paths:
  /deployments/{region}/{tier}:
    post:
      summary: Deploy workload
      description: Select region, tier, and channel before the request body schema appears.
      x-conditional:
        mode: cascade-bound-body
        keyJoin: "|"
        selectors:
          - name: region
            in: path
          - name: tier
            in: path
          - name: X-Channel
            in: header
      x-conditional-enum-map:
        region:
          us-east:
            tier:
              gold:
                X-Channel: [web, mobile]
              silver:
                X-Channel: [web]
          eu-west:
            tier:
              gold:
                X-Channel: [web]
      x-conditional-schema-map:
        us-east|gold|web: GoldWebDeployConfig
        us-east|gold|mobile: GoldMobileDeployConfig
        us-east|silver|web: SilverWebDeployConfig
        eu-west|gold|web: GoldWebDeployConfig
      x-conditional-example-map:
        us-east|gold|web:
          replicaCount: 3
          ingressHost: app.example.com
        us-east|gold|mobile:
          replicaCount: 2
          pushEnabled: true
      parameters:
        - name: region
          in: path
          required: true
          schema:
            type: string
        - name: tier
          in: path
          required: true
          schema:
            type: string
        - name: X-Channel
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/GoldWebDeployConfig"
                - $ref: "#/components/schemas/GoldMobileDeployConfig"
                - $ref: "#/components/schemas/SilverWebDeployConfig"
      responses:
        "200":
          description: Accepted

components:
  schemas:
    GoldWebDeployConfig:
      type: object
      required: [replicaCount, ingressHost]
      x-visibility:
        when:
          region: us-east
          tier: gold
          X-Channel: web
      properties:
        replicaCount:
          type: integer
        ingressHost:
          type: string

    GoldMobileDeployConfig:
      type: object
      x-visibility:
        when:
          region: us-east
          tier: gold
          X-Channel: mobile
      properties:
        replicaCount:
          type: integer
        pushEnabled:
          type: boolean

    SilverWebDeployConfig:
      type: object
      x-visibility:
        when:
          region: us-east
          tier: silver
          X-Channel: web
      properties:
        replicaCount:
          type: integer
        ingressHost:
          type: string
